<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Simple Frontend — Demo</title>
        <style>
            :root {
                --bg: #f7fafc;
                --card: #ffffff;
                --muted: #6b7280;
                --accent: #2563eb;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
                font-family: Inter, system-ui, Segoe UI, Roboto,
                    "Helvetica Neue", Arial;
            }
            body {
                background: var(--bg);
                color: #0f172a;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 28px;
            }

            .app {
                width: min(980px, 96%);
            }
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
            }
            .brand {
                display: flex;
                gap: 12px;
                align-items: center;
            }
            .logo {
                width: 44px;
                height: 44px;
                border-radius: 8px;
                background: linear-gradient(135deg, var(--accent), #7c3aed);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: 700;
            }
            h1 {
                font-size: 18px;
                margin: 0;
            }
            .subtitle {
                font-size: 13px;
                color: var(--muted);
            }

            main {
                display: grid;
                grid-template-columns: 1fr 320px;
                gap: 18px;
            }

            /* left column */
            .card {
                background: var(--card);
                border-radius: 12px;
                padding: 18px;
                box-shadow: 0 6px 18px rgba(2, 6, 23, 0.06);
            }
            .controls {
                display: flex;
                gap: 8px;
                margin-bottom: 14px;
            }
            button {
                border: 0;
                padding: 8px 12px;
                border-radius: 8px;
                cursor: pointer;
                font-weight: 600;
            }
            .btn-primary {
                background: linear-gradient(90deg, var(--accent), #7c3aed);
                color: #fff;
            }
            .btn-ghost {
                background: transparent;
                border: 1px solid #e6e9ef;
                color: var(--muted);
            }

            .list {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .item {
                padding: 12px;
                border-radius: 8px;
                border: 1px solid #eef2ff;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .item .meta {
                font-size: 14px;
                color: var(--muted);
            }

            /* right column */
            .form-row {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            label {
                font-size: 13px;
                color: var(--muted);
            }
            input[type="text"],
            textarea,
            select {
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #e6eef8;
                font-size: 14px;
            }
            textarea {
                min-height: 90px;
            }

            footer {
                margin-top: 16px;
                text-align: center;
                color: var(--muted);
                font-size: 13px;
            }

            /* small screens */
            @media (max-width: 860px) {
                main {
                    grid-template-columns: 1fr;
                }
                .right {
                    order: 2;
                }
            }

            /* dark mode support (toggle JS will add .dark on body) */
            body.dark {
                --bg: #0b1220;
                --card: #071026;
                color: #e6eef8;
                --muted: #9aa4b2;
            }
            body.dark .logo {
                background: linear-gradient(135deg, #06b6d4, #a78bfa);
            }
        </style>
    </head>
    <body>
        <div class="app">
            <header>
                <div class="brand">
                    <div class="logo">SF</div>
                    <div>
                        <h1>Simple Frontend</h1>
                        <div class="subtitle">
                            Tiny demo with vanilla HTML / CSS / JS
                        </div>
                    </div>
                </div>
                <div>
                    <button class="btn-ghost" id="themeToggle">
                        Toggle theme
                    </button>
                </div>
            </header>

            <main>
                <section class="card left">
                    <div class="controls">
                        <button class="btn-primary" id="addBtn">
                            Add item
                        </button>
                        <button class="btn-ghost" id="clearBtn">
                            Clear all
                        </button>
                    </div>

                    <div class="list" id="list">
                        <!-- items injected here -->
                    </div>

                    <footer>
                        Built with plain HTML, CSS and a few lines of JS.
                    </footer>
                </section>

                <aside class="card right">
                    <h3 style="margin-top: 0">Create item</h3>
                    <div class="form-row">
                        <label for="title">Title</label>
                        <input
                            id="title"
                            type="text"
                            placeholder="My todo or quick note"
                        />
                    </div>
                    <div class="form-row" style="margin-top: 8px">
                        <label for="note">Note</label>
                        <textarea
                            id="note"
                            placeholder="Add details..."
                        ></textarea>
                    </div>
                    <div style="margin-top: 10px; display: flex; gap: 8px">
                        <button class="btn-primary" id="saveBtn">Save</button>
                        <button class="btn-ghost" id="cancelBtn">Cancel</button>
                    </div>

                    <hr
                        style="
                            margin: 14px 0;
                            border: none;
                            border-top: 1px solid #eef2ff;
                        "
                    />
                    <div style="font-size: 13px; color: var(--muted)">
                        Click an item to mark done. Use the buttons to add or
                        clear items. Items persist in localStorage.
                    </div>
                </aside>
            </main>
        </div>

        <script>
            // tiny app state + helpers
            const listEl = document.getElementById("list");
            const addBtn = document.getElementById("addBtn");
            const clearBtn = document.getElementById("clearBtn");
            const saveBtn = document.getElementById("saveBtn");
            const cancelBtn = document.getElementById("cancelBtn");
            const titleEl = document.getElementById("title");
            const noteEl = document.getElementById("note");
            const themeToggle = document.getElementById("themeToggle");

            const STORAGE_KEY = "simple_frontend_items_v1";

            function load() {
                try {
                    return JSON.parse(
                        localStorage.getItem(STORAGE_KEY) || "[]"
                    );
                } catch {
                    return [];
                }
            }
            function save(items) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            }

            function render() {
                const items = load();
                listEl.innerHTML = items.length
                    ? items
                          .map(
                              (it, i) => `
        <div class="item" data-i="${i}">
          <div>
            <div style="font-weight:700">${escapeHtml(
                it.title || "(untitled)"
            )}</div>
            <div class="meta">${escapeHtml(it.note || "—")}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn-ghost" data-action="del" title="Delete">✕</button>
          </div>
        </div>
      `
                          )
                          .join("\n")
                    : '<div style="color:var(--muted);padding:18px">No items yet — try Add item or create one on the right.</div>';

                // attach click handlers
                listEl.querySelectorAll(".item").forEach((node) => {
                    node.addEventListener("click", (e) => {
                        if (e.target.dataset.action === "del") return;
                        const idx = Number(node.dataset.i);
                        const items = load();
                        items.splice(idx, 1);
                        save(items);
                        render();
                    });
                    node.querySelector('[data-action="del"]').addEventListener(
                        "click",
                        (ev) => {
                            ev.stopPropagation();
                            const idx = Number(node.dataset.i);
                            const items = load();
                            items.splice(idx, 1);
                            save(items);
                            render();
                        }
                    );
                });
            }

            function escapeHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            addBtn.addEventListener("click", () => {
                titleEl.focus();
                titleEl.value = "";
                noteEl.value = "";
            });

            saveBtn.addEventListener("click", () => {
                const title = titleEl.value.trim();
                const note = noteEl.value.trim();
                if (!title) {
                    alert("Please enter a title");
                    titleEl.focus();
                    return;
                }
                const items = load();
                items.unshift({ title, note, created: Date.now() });
                save(items);
                render();
                titleEl.value = "";
                noteEl.value = "";
            });

            cancelBtn.addEventListener("click", () => {
                titleEl.value = "";
                noteEl.value = "";
            });

            clearBtn.addEventListener("click", () => {
                if (confirm("Clear all items?")) {
                    localStorage.removeItem(STORAGE_KEY);
                    render();
                }
            });

            // theme toggle
            themeToggle.addEventListener("click", () => {
                document.body.classList.toggle("dark");
                localStorage.setItem(
                    "simple_frontend_theme",
                    document.body.classList.contains("dark") ? "dark" : "light"
                );
            });

            // load theme
            if (localStorage.getItem("simple_frontend_theme") === "dark")
                document.body.classList.add("dark");

            // initial render
            render();
        </script>
    </body>
</html>
